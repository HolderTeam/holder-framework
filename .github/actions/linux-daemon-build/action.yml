name: Linux daemon build
description: >-
  Build holderd against a resolved core SDK and stage its installed tree in
  daemon/out/artifacts/linux-backend. The caller checks out holder-framework and,
  in the same run, resolves core with the core-sdk action.
inputs:
  core-commit:
    description: Resolved core commit
    required: true
  build-type:
    description: SDK and daemon configuration
    default: RelWithDebInfo
  build-testing:
    description: ON also builds the daemon's tests
    default: 'ON'
runs:
  using: composite
  steps:
    - name: Prepare caste source dependency
      shell: bash
      working-directory: daemon
      run: git submodule update --init --recursive -- submodules/caste

    - uses: HolderTeam/holder-core/.github/actions/core-sdk@main
      with:
        commit: ${{ inputs.core-commit }}
        build-type: ${{ inputs.build-type }}

    - uses: ./.github/actions/linux-daemon-deps

    - name: Configure CMake
      shell: bash
      working-directory: daemon
      env:
        BUILD_TESTING: ${{ inputs.build-testing }}
      run: |
        cmake \
          -S . \
          -B build-linux \
          -G Ninja \
          -DCMAKE_BUILD_TYPE="$HOLDER_CORE_BUILD_TYPE" \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DBUILD_TESTING="$BUILD_TESTING"

    - name: Build backend executables
      shell: bash
      working-directory: daemon
      run: |
        # Core is prebuilt; this builds daemon executables and, when enabled, integration tests.
        cmake \
          --build build-linux \
          --parallel

    - name: Stage installed backend
      shell: bash
      working-directory: daemon
      run: |
        set -euo pipefail

        stage_dir="${PWD}/out/artifacts/linux-backend"
        install -d "${stage_dir}/release"

        DESTDIR="${stage_dir}" cmake --install build-linux

        # Subproject install rules also provide development files. The
        # AppImage component artifact needs the shared caste runtime, but
        # not headers, static archives, CMake package files, or man pages.
        rm -rf \
          "${stage_dir}/usr/include" \
          "${stage_dir}/usr/share/man"
        find "${stage_dir}/usr/lib" -type f -name '*.a' -delete
        find "${stage_dir}/usr/lib" -type d -name cmake -prune \
          -exec rm -rf {} +

        tr -d '[:space:]' < ../VERSION \
          > "${stage_dir}/release/holder-daemon-version.txt"
        tr -d '[:space:]' < ../api/API_VERSION \
          > "${stage_dir}/release/holder-daemon-api-version.txt"
        printf '%s\n' "$(git rev-parse HEAD)" \
          > "${stage_dir}/release/holder-daemon-commit.txt"

        (
          cd "${stage_dir}"
          find . \( -type f -o -type l \) \
            ! -path './release/holder-daemon-manifest.txt' \
            | sed 's#^\./##' \
            | sort \
            > release/holder-daemon-manifest.txt
        )

        find "${stage_dir}" -type f | sort
