name: Daemon / CI

on:
  # Pull requests always start this workflow so that its required result check is reported;
  # the changes job decides whether the daemon jobs run. Keep its pattern in step with these paths.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'VERSION'
      - '.gitmodules'
      - '.github/workflows/daemon-*.yml'
      - 'cli/**'
      - 'common/**'
      - 'api/**'
  workflow_dispatch:
    inputs:
      core_ref:
        description: Core version tag or full SHA (empty selects latest-green)
        type: string
      core_build_type:
        description: SDK and daemon configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo
  workflow_call:
    inputs:
      core_ref:
        description: Exact published core commit
        required: true
        type: string
      core_build_type:
        description: SDK and daemon configuration
        type: string
        default: RelWithDebInfo
      daemon_ref:
        description: Daemon source revision (resolved once)
        default: main
        type: string

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      daemon: ${{ steps.select.outputs.daemon }}
    env:
      # holder-core calls this workflow from its own pull requests; those build everything.
      SCOPED: ${{ github.event_name == 'pull_request' && github.repository == 'HolderTeam/holder-framework' }}
    steps:
      - if: env.SCOPED == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select jobs from the changed paths
        run: |
          if [[ "$SCOPED" != true ]]; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The pull request merge commit's parents are the base and the pull request head.
          changed=$(git diff --name-only HEAD^1...HEAD^2)
          printf '%s\n' "$changed"
          if grep -qE '^(daemon/|cli/|common/|api/|VERSION$|\.gitmodules$|\.github/workflows/daemon-)' <<< "$changed"; then
            echo "daemon=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=false" >> "$GITHUB_OUTPUT"
          fi
  resolve:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    outputs:
      core_commit: ${{ steps.core.outputs.commit }}
      daemon_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HolderTeam/holder-framework
          ref: ${{ github.repository == 'HolderTeam/holder-framework' && github.sha || inputs.daemon_ref || 'main' }}
          persist-credentials: false
      - name: Validate SDK configuration
        env:
          BUILD_TYPE: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
        run: |
          case "$BUILD_TYPE" in
            RelWithDebInfo|Release) ;;
            *) echo "Unsupported SDK configuration: $BUILD_TYPE" >&2; exit 1 ;;
          esac
      - id: source
        name: Record daemon source revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: core
        uses: HolderTeam/holder-core/.github/actions/core-sdk@main
        with:
          command: resolve
          core-ref: ${{ inputs.core_ref || 'latest-green' }}
  linux:
    needs: resolve
    uses: ./.github/workflows/daemon-linux-backend.yml
    with:
      core_commit: ${{ needs.resolve.outputs.core_commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  macos:
    needs: resolve
    uses: ./.github/workflows/daemon-macos-backend.yml
    with:
      core_commit: ${{ needs.resolve.outputs.core_commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  windows:
    needs: resolve
    uses: ./.github/workflows/daemon-windows-backend.yml
    with:
      core_commit: ${{ needs.resolve.outputs.core_commit }}
      daemon_commit: ${{ needs.resolve.outputs.daemon_commit }}
      build_type: ${{ inputs.core_build_type || 'RelWithDebInfo' }}
  ubuntu-packages:
    if: github.repository == 'HolderTeam/holder-framework' && inputs.core_build_type != 'Release'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            series: noble
          - image: ubuntu:26.04
            series: resolute
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    env:
      # The package is built from daemon/ copied out on its own, as the Debian source package is,
      # so a file the build reads from beside daemon/ shows up here instead of on Launchpad.
      EXPORTED_DAEMON: /tmp/export/daemon
    steps:
      - name: Install packaging tools and configure package source
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates software-properties-common git devscripts equivs debhelper cmake ninja-build
          add-apt-repository -y ppa:holderteam/holder
          apt-get update
      - uses: actions/checkout@v4
        with:
          repository: HolderTeam/holder-framework
          ref: ${{ needs.resolve.outputs.daemon_commit }}
          persist-credentials: false
      - name: Export daemon/ on its own, as the Debian source package sees it
        run: |
          mkdir -p "$(dirname "${EXPORTED_DAEMON}")"
          cp -a daemon "${EXPORTED_DAEMON}"
          daemon/packaging/linux/prepare-source-tree.sh "${GITHUB_WORKSPACE}" "${EXPORTED_DAEMON}"
      - name: Build daemon with distribution core packages
        env:
          DEBIAN_FRONTEND: noninteractive
        working-directory: ${{ env.EXPORTED_DAEMON }}
        run: |
          cp -a packaging/linux/debian debian
          mk-build-deps --install --remove --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-buildpackage -b -us -uc -j2
      - name: Verify shared core linkage and package dependency
        shell: bash
        working-directory: ${{ env.EXPORTED_DAEMON }}
        run: |
          ldd build/holderd | grep 'libholder.so.0'
          ldd build/holderctl | grep 'libholder.so.0'
          package=$(find .. -maxdepth 1 -name 'holder-daemon_*.deb' -print -quit)
          dpkg-deb -f "$package" Depends | grep 'libholder0'
          test ! -d build/holder-core
          dpkg -i "$package"
          holderd --version
          holderctl --help
          mkdir -p out/ubuntu-packages
          cp "$package" out/ubuntu-packages/
      - uses: actions/upload-artifact@v4
        with:
          name: holder-daemon-${{ matrix.series }}-packages
          path: ${{ env.EXPORTED_DAEMON }}/out/ubuntu-packages/*.deb
          if-no-files-found: error
  result:
    name: Daemon CI result
    # The required check. It runs even when jobs fail or are skipped, and passes only when every
    # selected job succeeded and no job ran that was not selected.
    if: always()
    needs: [changes, resolve, linux, macos, windows, ubuntu-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          SELECTED: ${{ needs.changes.outputs.daemon }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e --arg selected "$SELECTED" '
            .changes.result == "success" and
            (if $selected == "true" then
               ([.resolve, .linux, .macos, .windows] | all(.result == "success")) and
               (.["ubuntu-packages"].result | IN("success", "skipped"))
             else
               ([.resolve, .linux, .macos, .windows, .["ubuntu-packages"]] | all(.result == "skipped"))
             end)' <<< "$RESULTS" > /dev/null
