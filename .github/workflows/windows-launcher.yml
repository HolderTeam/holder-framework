name: Launcher / Windows

on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'VERSION'
      - '.github/workflows/windows-launcher.yml'
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - 'VERSION'
      - '.github/workflows/windows-launcher.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: Launcher configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo

permissions:
  contents: read

jobs:
  build:
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'RelWithDebInfo' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Set up Python for tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
            -DCMAKE_CXX_COMPILER=cl `
            -DBUILD_TESTING=ON

      - name: Build launcher and tests
        run: cmake --build build --parallel

      - name: Test Windows probe and launcher
        run: ctest --test-dir build --output-on-failure

      - name: Stage launcher artifact with provenance and symbols
        run: cmake --build build --target stage_artifact

      - name: Verify staged artifact checksums and inventory
        run: python scripts/artifact.py verify build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}

      - name: Upload launcher artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holder-launcher-windows${{ inputs.build_type == 'Release' && '-release' || '' }}
          path: launcher/build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}/
          if-no-files-found: error
          retention-days: 90
