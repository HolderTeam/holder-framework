name: Launcher / macOS

on:
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/macos-launcher.yml'
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - '.github/workflows/macos-launcher.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: Launcher configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo

permissions:
  contents: read

jobs:
  build:
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'RelWithDebInfo' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: launcher

    steps:
      - name: Check out holder-framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build launcher and tests
        run: cmake --build build --parallel

      - name: Test macOS launcher components
        run: ctest --test-dir build --output-on-failure

      - name: Stage launcher artifact with provenance and symbols
        run: cmake --build build --target stage_artifact

      - name: Verify staged artifact checksums and inventory
        run: python3 scripts/artifact.py verify build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}

      - name: Upload launcher artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holder-launcher-macos${{ inputs.build_type == 'Release' && '-release' || '' }}
          path: launcher/build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}/
          if-no-files-found: error
          retention-days: 90
