name: Python / Check

on:
  pull_request:
    paths:
      - 'python/**'
      - 'api/openapi.yaml'
      - '.github/workflows/python-check.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'api/openapi.yaml'
      - '.github/workflows/python-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate.py --check --source ../api/openapi.yaml
      - run: ruff check scripts tests src/holder/events.py
      - run: python -m pytest
      - run: python -m build
